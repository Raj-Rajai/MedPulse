  <script>
    (function() {
      try {
        var c = localStorage.getItem('sidebar_collapsed');
        if (c === '1' || c === 'true') {
          document.documentElement.classList.add('sidebar-collapsed');
        }
      } catch (e) {}
      window.addEventListener('DOMContentLoaded', function() {
        requestAnimationFrame(function() {
          document.documentElement.classList.remove('preload-transitions');
        });
      });
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;850;900&display=swap" rel="stylesheet">

</head>

</body>
