<!DOCTYPE html>
<html lang="en" class="preload-transitions">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/app-192.png">
  <script src="/pwa.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121026">
  <title>Student Registration Moved | MedPulse</title>
  <meta http-equiv="refresh" content="0; url=/login.html#admin">
  <script>
    window.location.replace('/login.html#admin');
  </script>
  <script src="/auth-guard.js"></script>
  <script>
    (function() {
      try {
        document.documentElement.classList.remove('sidebar-collapsed');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg-body, #f5f3ff);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .login-page-container {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      box-sizing: border-box;
    }
    .login-wrapper {
      width: 100%;
      max-width: 590px;
      margin: 0 auto !important;
    }
    .login-brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      text-decoration: none;
    }
    .login-brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #6d28d9, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(109, 40, 217, 0.3);
    }
    .login-brand-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .login-brand-text .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary, #1e1b4b);
      line-height: 1.1;
    }
    .login-brand-text .brand-subtitle {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent, #6d28d9);
      text-transform: uppercase;
    }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.78rem;
      color: var(--text-muted, #8b83b0);
      font-weight: 500;
    }
    @media (max-width: 640px) {
      .login-page-container {
        padding: 24px 12px;
        align-items: flex-start;
      }
      .login-brand-header {
        margin-bottom: 18px;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>

  <main class="login-page-container">
    <div class="login-wrapper mode-register" id="loginWrapper">

      <!-- MedPulse Brand Header -->
      <a href="/" class="login-brand-header" title="MedPulse Health Portal">
        <div class="login-brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <div class="login-brand-text">
          <span class="brand-title">MedPulse</span>
          <span class="brand-subtitle">Health Portal</span>
        </div>
      </a>

      <div class="login-card">
        <!-- Auth Mode Switcher -->
        <div class="auth-mode-nav state-register" id="authModeNav">
          <div class="auth-mode-glider" id="authModeGlider"></div>
          <button type="button" class="auth-mode-btn" id="tabSignIn" onclick="window.location.href='/login.html'">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Sign In
          </button>
          <button type="button" class="auth-mode-btn active" id="tabRegister" onclick="void(0)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
            Register Student
          </button>
        </div>

        <!-- Header -->
        <div style="text-align: center; margin-bottom: 20px;">
          <div class="anim-float" id="authHeaderIcon" style="width: 54px; height: 54px; margin: 0 auto 12px; background: linear-gradient(135deg, #7c3aed, #6d28d9, #4f46e5); color: #fff; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; box-shadow: 0 8px 24px rgba(109, 40, 217, 0.4);">
            📝
          </div>
          <h2 class="page-title-animated" id="authTitle" style="font-size: 1.45rem; font-weight: 800; margin-bottom: 4px;">Student Cadre Registration</h2>
          <p id="authSubtitle" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
            Register your clinical student profile to begin field health surveys.
          </p>
        </div>

        <div id="authAlert" style="display: none;" class="alert alert-error"></div>
        <div id="authSuccess" style="display: none;" class="alert alert-success"></div>

        <!-- Student Registration Panel Form -->
        <div id="registerPane" class="auth-pane active">
          <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group" style="margin-bottom: 0.85rem;">
              <label for="regName">Full Name <span style="color: #ef4444;">*</span></label>
              <input type="text" id="regName" placeholder="e.g. Dr. Ananya Sharma" required autofocus>
            </div>

            <div class="reg-grid-2" style="margin-bottom: 0.85rem;">
              <div class="form-group">
                <label for="regRoll">Roll Number <span style="color: #ef4444;">*</span></label>
                <input type="text" id="regRoll" placeholder="e.g. 236" required>
              </div>

              <div class="form-group">
                <label for="regBatch">MBBS Batch / Year</label>
                <select id="regBatch">
                  <option value="3rd Year MBBS (Community Medicine)" selected>3rd Year MBBS (PSM)</option>
                  <option value="2nd Year MBBS">2nd Year MBBS</option>
                  <option value="Final Year MBBS Part 1">Final Year MBBS Part 1</option>
                  <option value="Final Year MBBS Part 2">Final Year MBBS Part 2</option>
                  <option value="CRMI Intern Doctor">CRMI Intern Doctor</option>
                </select>
              </div>
            </div>

            <div class="reg-grid-2" style="margin-bottom: 0.85rem;">
              <div class="form-group">
                <label for="regPin">Security PIN (4-6 digits) <span style="color: #ef4444;">*</span></label>
                <input type="password" id="regPin" placeholder="e.g. 1234" minlength="4" maxlength="8" required oninput="validatePinMatch()">
              </div>

              <div class="form-group">
                <label for="regPinConfirm">Confirm PIN <span style="color: #ef4444;">*</span></label>
                <input type="password" id="regPinConfirm" placeholder="Re-enter PIN" minlength="4" maxlength="8" required oninput="validatePinMatch()">
              </div>
            </div>
            <div id="pinMismatchMsg" class="pin-feedback-hint" style="display: none; color: #ef4444; margin-bottom: 0.85rem;">⚠️ PINs do not match</div>

            <div class="reg-grid-2" style="margin-bottom: 0.85rem;">
              <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" placeholder="ananya.sharma@medpulse.edu">
              </div>

              <div class="form-group">
                <label for="regPhone">Contact Phone</label>
                <input type="tel" id="regPhone" placeholder="10-digit mobile number">
              </div>
            </div>

            <div class="form-group" style="margin-bottom: 0.85rem;">
              <label for="regUnit">Clinical Posting Unit</label>
              <select id="regUnit">
                <option value="RHTC - Rural Health Training Center" selected>RHTC - Rural Health Training Center</option>
                <option value="UHTC - Urban Health Training Center">UHTC - Urban Health Training Center</option>
                <option value="Community Medicine Unit 1">Community Medicine Unit 1</option>
                <option value="Community Medicine Unit 2">Community Medicine Unit 2</option>
                <option value="Primary Health Center (PHC) Posting">Primary Health Center (PHC) Posting</option>
                <option value="Field Health Survey Department">Field Health Survey Department</option>
              </select>
            </div>

            <div class="form-group" style="margin-bottom: 1.35rem;">
              <label for="regCollege">Medical College / Institution</label>
              <select id="regCollege">
                <option value="1">SAL Institute of Medical Sciences & Hospital</option>
              </select>
            </div>

            <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.82rem; font-size: 0.95rem;">
              ✨ Complete Registration & Launch Portal &rarr;
            </button>
          </form>

          <div class="section-divider"></div>

          <div style="text-align: center;">
            <p style="font-size: 0.82rem; color: var(--text-secondary);">
              Already registered? <a href="/login.html" style="color: var(--accent); font-weight: 650; text-decoration: underline;">Sign In to Portal &rarr;</a>
            </p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.documentElement.classList.remove('preload-transitions');
      });
    });

    function runWhenActive(callback) {
      if (document.visibilityState === 'visible') {
        callback();
      } else {
        const onVisible = () => {
          if (document.visibilityState === 'visible') {
            document.removeEventListener('visibilitychange', onVisible);
            callback();
          }
        };
        document.addEventListener('visibilitychange', onVisible);
      }
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebarOverlay');
      if (window.innerWidth <= 860) {
        const isOpen = sb.classList.toggle('open');
        if (ov) ov.classList.toggle('active', isOpen);
      } else {
        const isCollapsed = document.documentElement.classList.toggle('sidebar-collapsed');
        document.body.classList.toggle('sidebar-collapsed', isCollapsed);
        localStorage.setItem('sidebar_collapsed', isCollapsed ? '1' : '0');
      }
    }

    function closeSidebar() {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebarOverlay');
      if (window.innerWidth <= 860) {
        if (sb) sb.classList.remove('open');
        if (ov) ov.classList.remove('active');
      } else {
        document.documentElement.classList.add('sidebar-collapsed');
        document.body.classList.add('sidebar-collapsed');
        localStorage.setItem('sidebar_collapsed', '1');
      }
    }

    function initSidebar() {
      const isCollapsed = (localStorage.getItem('sidebar_collapsed') === '1' || localStorage.getItem('sidebar_collapsed') === 'true') && window.innerWidth > 860;
      if (isCollapsed) {
        document.documentElement.classList.add('sidebar-collapsed');
        document.body.classList.add('sidebar-collapsed');
      } else {
        document.documentElement.classList.remove('sidebar-collapsed');
        document.body.classList.remove('sidebar-collapsed');
      }
    }

    function initAuth() {
      const userStr = localStorage.getItem('medpulse_user');
      const authArea = document.getElementById('authNavArea');
      if (!authArea) return;
      if (userStr) {
        try {
          const user = JSON.parse(userStr);
          authArea.innerHTML = `
            <div class="sidebar-user" data-tooltip="Roll ${user.roll_number} (View Profile)" onclick="if(document.documentElement.classList.contains('sidebar-collapsed')||document.body.classList.contains('sidebar-collapsed')){logoutRegisterUser();}else{window.location.href='/profile.html';}" title="Roll ${user.roll_number}">
              <div class="user-avatar-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="role-dot"></span>
              </div>
              <div class="user-info-text">
                <span style="font-size: 0.72rem; color: rgba(255,255,255,0.5); display: block;">Student</span>
                <span style="font-weight: 700; color: #fff;">Roll ${user.roll_number}</span>
              </div>
              <button class="logout-btn" onclick="event.stopPropagation(); logoutRegisterUser();" title="Logout">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
              </button>
            </div>
          `;
        } catch (e) {
          showLoginLink(authArea);
        }
      } else {
        showLoginLink(authArea);
      }
    }

    function showLoginLink(authArea) {
      if (!authArea) return;
      authArea.innerHTML = `
        <a href="/login.html" class="sidebar-login-link" title="Sign In">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span class="login-label">Sign In</span>
        </a>
      `;
    }

    function logoutRegisterUser() {
      localStorage.removeItem('medpulse_user');
      window.location.reload();
    }

    async function loadColleges() {
      try {
        const res = await fetch('/api/colleges');
        if (!res.ok) return;
        const colleges = await res.json();
        const sel = document.getElementById('regCollege');
        if (sel && Array.isArray(colleges) && colleges.length > 0) {
          sel.innerHTML = colleges.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }
      } catch (e) {
        console.warn('Could not load colleges:', e);
      }
    }

    function validatePinMatch() {
      const pin = document.getElementById('regPin').value;
      const confirm = document.getElementById('regPinConfirm').value;
      const hint = document.getElementById('pinMismatchMsg');
      if (confirm && pin !== confirm) {
        hint.style.display = 'block';
        return false;
      } else {
        hint.style.display = 'none';
        return true;
      }
    }

    async function handleRegister(event) {
      if (event) event.preventDefault();
      const alertBox = document.getElementById('authAlert');
      const successBox = document.getElementById('authSuccess');
      const btn = document.getElementById('regSubmitBtn');

      alertBox.style.display = 'none';
      successBox.style.display = 'none';

      if (!validatePinMatch()) {
        alertBox.textContent = 'PIN / Passcode and confirmation do not match.';
        alertBox.style.display = 'block';
        return;
      }

      const roll = document.getElementById('regRoll').value.trim();
      const name = document.getElementById('regName').value.trim();
      const pin = document.getElementById('regPin').value.trim();
      const batch = document.getElementById('regBatch').value;
      const emailInput = document.getElementById('regEmail');
      const phoneInput = document.getElementById('regPhone');
      const email = emailInput.value.trim();
      const phone = phoneInput.value.trim();
      const collegeId = document.getElementById('regCollege').value;

      if (!roll || !name) {
        alertBox.textContent = 'Please provide both Student Name and Roll Number.';
        alertBox.style.display = 'block';
        return;
      }

      // Frontend Email Validation
      if (email && window.MedPulseValidation) {
        const emailCheck = MedPulseValidation.validateEmail(email, false);
        if (!emailCheck.valid) {
          alertBox.textContent = emailCheck.error;
          alertBox.style.display = 'block';
          MedPulseValidation.showError(emailInput, emailCheck.error);
          emailInput.focus();
          return;
        }
      }

      // Frontend 10-Digit Phone Validation
      let cleanPhoneVal = phone;
      if (phone && window.MedPulseValidation) {
        const phoneCheck = MedPulseValidation.validatePhone(phone, false);
        if (!phoneCheck.valid) {
          alertBox.textContent = phoneCheck.error;
          alertBox.style.display = 'block';
          MedPulseValidation.showError(phoneInput, phoneCheck.error);
          phoneInput.focus();
          return;
        }
        cleanPhoneVal = phoneCheck.clean;
      }

      btn.disabled = true;
      btn.innerHTML = '⏳ Registering Student...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            roll_number: roll,
            name: name,
            pin: pin,
            batch_year: batch,
            posting_unit: unit,
            email: email,
            phone: cleanPhoneVal,
            college_id: collegeId
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        successBox.textContent = `🎉 Registration successful! Welcome, ${data.student.name}. Launching portal...`;
        successBox.style.display = 'block';

        // Auto-login newly registered student
        localStorage.setItem('medpulse_user', JSON.stringify(data.student));

        setTimeout(() => {
          const params = new URLSearchParams(window.location.search);
          const target = params.get('redirect') || '/family-manage.html';
          window.location.href = target;
        }, 1200);

      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '✨ Complete Registration & Launch Portal &rarr;';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      initAuth();
      loadColleges();

      if (window.MedPulseValidation) {
        MedPulseValidation.attachEmail('regEmail', true);
        MedPulseValidation.attachPhone('regPhone', true);
      }
    });
  </script>

  <script src="/validation.js"></script>
  <script src="/nav-glider.js"></script>
</body>
</html>
